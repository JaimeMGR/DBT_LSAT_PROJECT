# ============================================================================
# dbt_project.yml — Fichero principal de configuración del proyecto
# ============================================================================
# Este es el archivo central de cualquier proyecto dbt. Aquí definimos:
#   - Nombre y versión del proyecto
#   - Profile que usaremos (la conexión al DW)
#   - Rutas de los distintos tipos de archivos (models, tests, seeds, ...)
#   - Configuraciones por defecto para cada tipo de recurso (materialización,
#     base de datos, schema, transient, ...)
#   - Hooks que se ejecutan al inicio/final de cada ejecución
#   - Variables de proyecto
#
# IMPORTANTE: las configuraciones aquí pueden ser sobreescritas en cada
# modelo concreto usando el bloque `{{ config(...) }}`.
# ============================================================================

name: 'steam_games'
version: '1.0.0'
config-version: 2

profile: 'steam_games'

# Rutas de los directorios del proyecto
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# =============================================================================
# CONFIGURACIÓN DE MODELOS POR CAPA
# Cada capa escribe en su base de datos y schema correspondiente
# =============================================================================
models:
  steam_games:

    # ── STAGING (Silver) ──────────────────────────────────────────────────────
    # Limpieza, tipado y renombrado de columnas. Materialización: view.
    # Escribe en DEV_SILVER_DB_STEAM.STAGING
    staging:
      +materialized: view
      +database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_SILVER_DB_STEAM"
      +schema: STAGING

    # ── INTERMEDIATE (Silver) ─────────────────────────────────────────────────
    # Lógica de negocio reutilizable, joins y cálculos previos a marts.
    # Materialización: view
    # Escribe en DEV_SILVER_DB_STEAM.INTERMEDIATE
    intermediate:
      +materialized: view
      +database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_SILVER_DB_STEAM"
      +schema: INTERMEDIATE

    # ── MARTS (Gold) ──────────────────────────────────────────────────────────
    # Tablas dimensionales y de hechos listas para Power BI.
    # Materialización: table (datos optimizados para consulta).
    # Escribe en DEV_GOLD_DB_STEAM.MARTS
    marts:
      +materialized: table
      +database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_GOLD_DB_STEAM"
      +schema: MARTS

# =============================================================================
# SEEDS
# Tablas de referencia estáticas (p.ej. segmentos, mapeos)
# =============================================================================
seeds:
  steam_games:
    +database: "{{ env_var('DBT_ENVIRONMENTS', 'FAIL') }}_GOLD_DB_STEAM"
    +schema: MARTS
