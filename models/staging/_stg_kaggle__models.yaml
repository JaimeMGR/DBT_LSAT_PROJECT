version: 2

models:
  - name: stg_kaggle__games
    description: >
      Modelo de staging que limpia y tipea la tabla raw GAMES_RAW de Bronze.
      Elimina duplicados, normaliza nulos, castea fechas y números,
      y extrae IDs de Steam. Una fila = un juego único.
    columns:

      - name: id_steam
        description: >
          ID numérico del juego en Steam (extraído del link)
        tests:
          - unique
          - not_null

      - name: nombre_juego
        description: >
          Nombre del juego en Steam
        tests:
          - not_null

      - name: link
        description: >
          URL relativa del juego en Steam
        tests:
          - unique
          - not_null

      - name: fecha_lanzamiento
        description: >
          Fecha de lanzamiento parseada (NULL si formato inválido)

      - name: fecha_pico_historico
        description: >
          Fecha en que se alcanzó el pico histórico de jugadores

      - name: fecha_mod_tienda
        description: >
          Fecha de última modificación del asset en tienda

      - name: pico_jugadores_reciente
        description: >
          Pico de jugadores reciente (entero limpio)

      - name: resenas_positivas
        description: >
          Número de reseñas positivas

      - name: resenas_negativas
        description: >
          Número de reseñas negativas

      - name: total_resenas
        description: >
          Total de reseñas

      - name: puntuacion
        description: >
          Puntuación del juego (0-100)
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100

      - name: porcentaje_positivo
        description: >
          Porcentaje de reseñas positivas (0-100)
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100

      - name: jugadores_actuales
        description: >
          Jugadores conectados al momento de la extracción

      - name: pico_24h
        description: >
          Pico de jugadores en las últimas 24 horas

      - name: pico_historico
        description: >
          Pico histórico absoluto de jugadores

      - name: genero_primario
        description: >
          Nombre del género principal (texto limpio sin ID)

      - name: id_genero_primario_steam
        description: >
          ID del género principal en Steam

      - name: store_genres
        description: >
          Lista completa de géneros separada por coma

      - name: publisher
        description: >
          Editor(es) del juego

      - name: developer
        description: >
          Desarrollador(es) del juego

      - name: detected_technologies
        description: >
          Tecnologías detectadas separadas por punto y coma

      - name: flag_fecha_invalida
        description: >
          TRUE si la fecha de lanzamiento no pudo parsearse

      - name: flag_numero_invalido
        description: >
          TRUE si algún campo numérico clave vino corrupto del origen

      - name: _loaded_at
        description: >
          Timestamp de carga a Bronze

      - name: _source_file
        description: >
          Nombre del archivo origen


  - name: stg_kaggle__player
    description: >
      Modelo de staging que limpia y tipea la tabla raw PLAYER_RAW de Bronze.
      
    columns:

      - name: player_id
        description: >
          ID numérico del jugador en Steam
        tests:
          - unique
          - not_null

      - name: nickname
        description: >
          Nombre del jugador
        tests:
          - not_null

      - name: age
        description: >
          Fecha de nacimiento (NULL si formato inválido)
        tests:
          - valid_date
          - not_null

      - name: mail
        description: >
          direccion de correo del jugador
        tests:
          - unique
          - not_null

      - name: date_creation_profile
        description: >
          Fecha de creación de la cuenta de usuario

      - name: _loaded_at
        description: >
          Timestamp de carga a Bronze

      - name: _source_file
        description: >
          Nombre del archivo origen


  - name: stg_kaggle__match
    description: >
      Modelo de staging que limpia y tipea la tabla raw PLAYER_RAW de Bronze.
      
    columns:

      - name: match_id
        description: >
          ID numérico de la partida
        tests:
          - unique
          - not_null

      - name: game_id
        description: >
          ID del juego referenciado en bronce
        tests:
          - not_null

      - name: gamemode_id
        description: >
          ID del modo de juego de la partida (en Bronce es el nombre)
        tests:
          - not_null

      - name: team_winner
        description: >
          Referencia a que equipo ha ganado
        tests:
          - unique
          - not_null

      - name: Final_score
        description: >
          Puntuación final de la partida

      - name: day_started 
        description: >
          fecha de que día ha empezado la partida

      - name: day_ended 
        description: >
          fecha de que día ha terminado la partida

      - name: hour_started 
        description: >
          hora de que día ha empezado la partida

      - name: hour_ended 
        description: >
          hora de que día ha terminado la partida

      - name: id_region 
        description: >
          Region donde se ha jugado la partida

      - name: _loaded_at
        description: >
          Timestamp de carga a Bronze

      - name: _source_file
        description: >
          Nombre del archivo origen


  - name: stg_kaggle__match_player
    description: >
      Modelo de staging que limpia y tipea la tabla raw MATCH_PLAYER_RAW de Bronze.
      Elimina duplicados, normaliza nulos, castea fechas y números,
      y extrae IDs de Steam. Una fila = un juego único.
    columns:

      - name: match_id
        description: >
          ID numérico del juego en Steam (extraído del link)
        tests:
          - not_null

      - name: player_id
        description: >
          Nombre del juego en Steam
        tests:
          - not_null

      - name: kills
        description: >
          Cantidad de kills
        tests:
          - not_null

      - name: deaths
        description: >
          Cantidad de muertes
        tests:
          - not_null

      - name: assists
        description: >
          Cantidad de asistencias
        tests:
          - not_null

      - name: score
        description: >
          Puntuación al final de la partida
        tests:
          - not_null

      - name: _loaded_at
        description: >
          Timestamp de carga a Bronze

      - name: _source_file
        description: >
          Nombre del archivo origen