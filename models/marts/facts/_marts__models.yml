version: 2

models:

  # ── DIMENSIONES ────────────────────────────────────────────────────────────

  - name: dim_juego
    description: '{{ doc("dim_juego") }}'
    columns:
      - name: id_juego
        description: Clave surrogada (hash del id_steam)
        data_tests:
          - unique
          - not_null
      - name: id_steam
        description: ID numérico nativo de Steam
        data_tests:
          - unique
          - not_null
      - name: nombre
        description: Nombre del juego
        tests: [not_null]

  - name: dim_fecha
    description: '{{ doc("dim_fecha") }}'
    columns:
      - name: id_fecha
        description: Clave surrogada (hash de la fecha)
        data_tests:
          - unique
          - not_null
      - name: fecha_completa
        description: Fecha en formato DATE
        data_tests:
          - unique
          - not_null

  - name: dim_desarrollador
    description: '{{ doc("dim_desarrollador") }}'
    columns:
      - name: id_desarrollador
        description: Clave surrogada
        data_tests:
          - unique
          - not_null
      - name: nombre
        description: Nombre del desarrollador
        data_tests:
          - unique
          - not_null

  - name: dim_editor
    columns:
      - name: id_editor
        description: Clave surrogada
        data_tests:
          - unique
          - not_null
      - name: nombre
        description: Nombre del editor
        data_tests:
          - unique
          - not_null

  - name: dim_genero
    description: '{{ doc("dim_genero") }}'
    columns:
      - name: id_genero
        description: Clave surrogada
        data_tests:
          - unique
          - not_null
      - name: id_genero_steam
        description: ID nativo de Steam del género
        data_tests:
          - unique
          - not_null

  - name: dim_tecnologia
    description: '{{ doc("dim_tecnologia") }}'
    columns:
      - name: id_tecnologia
        description: Clave surrogada
        data_tests:
          - unique
          - not_null

  - name: dim_segmento
    description: '{{ doc("dim_segmento") }}'
    columns:
      - name: id_segmento
        description: ID del segmento (1-5)
        data_tests:
          - unique
          - not_null

  # ── HECHOS ─────────────────────────────────────────────────────────────────

  - name: fct_actividad_juego
    description: '{{ doc("fct_actividad_juego") }}'
    columns:
      - name: id_juego
        description: FK a dim_juego
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_juego')
              field: id_juego
      - name: pico_historico
        description: Pico histórico de jugadores simultáneos
      - name: total_resenas
        description: Total de reseñas del juego
      - name: puntuacion
        description: Puntuación del juego (0-100)
      - name: dias_hasta_pico
        description: '{{ doc("dias_hasta_pico") }}'
      - name: ratio_retencion
        description: '{{ doc("ratio_retencion") }}'

  - name: puente_juego_tecnologia
    description: >
      Tabla puente que resuelve la relación muchos a muchos entre
      DIM_JUEGO y DIM_TECNOLOGIA. Una fila = un juego usando una tecnología.
    columns:
      - name: id_juego
        description: FK a DIM_JUEGO
        data_tests:
          - not_null
      - name: id_tecnologia
        description: FK a DIM_TECNOLOGIA
        data_tests:
          - not_null

  - name: puente_juego_genero
    description: >
      Tabla puente que resuelve la relación muchos a muchos entre
      DIM_JUEGO y DIM_GENERO. Una fila = un juego perteneciendo a un género.
    columns:
      - name: id_juego
        description: FK a DIM_JUEGO
        data_tests:
          - not_null
      - name: id_genero
        description: FK a DIM_GENERO
        data_tests:
          - not_null
      - name: es_primario
        description: TRUE si es el género principal del juego
